<div class="form-actions">
    <button type="button" class="button button-warning"
            hx-post="/preview-config-changes"
            hx-include="closest form"
            hx-target="#config-preview"
            hx-swap="innerHTML">Preview Changes</button>
    <button type="button" class="button button-success"
            hx-post="/save-config"
            hx-include="closest form"
            hx-target="#config-save-result"
            hx-swap="innerHTML">Save Configuration</button>
    <a href="/" class="button">Cancel</a>
</div>

<!-- Save Results Area -->
<div id="config-save-result" style="margin-top: 10px;">
    <!-- Save feedback will be loaded here via HTMX -->
</div>

<!-- Preview Results Area -->
<div id="config-preview" class="section-container" style="margin-top: 20px; display: none;">
    <!-- Preview content will be loaded here via HTMX -->
</div>
