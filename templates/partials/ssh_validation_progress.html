<div class="alert alert-info" id="ssh-validation-container"

     sse-connect="/ssh/stream/{{ session_id }}"
     sse-swap="progress,success,error">

    <div class="code-container" id="ssh-progress-log">{{ initial_message }}</div>
</div>
