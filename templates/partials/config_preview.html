<div id="config-preview" class="section-container" style="margin-top: 20px; display: block !important;" hx-swap-oob="outerHTML:#config-preview">
{% if success %}
<div class="alert alert-info">
    <h3>Configuration Preview</h3>
    <p>This shows exactly what would be saved to your configuration file. Review carefully before clicking "Save Configuration".</p>
</div>

<div class="code-container log-container">
    <div class="log-viewer">{{ preview_yaml }}</div>
</div>

<div style="margin-top: 15px;">
    <button type="button" class="button" 
            hx-target="#config-preview"
            hx-swap="innerHTML"
            hx-post="/hide-preview">
        Hide Preview
    </button>
</div>

{% else %}
<div class="alert alert-error">
    <h3>Preview Error</h3>
    <p>{{ error_message }}</p>
</div>
{% endif %}
</div>
