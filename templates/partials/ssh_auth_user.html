<div class="form-group">
    <label for="highball_pubkey">Highball SSH Public Key:</label>
    <textarea id="highball_pubkey" name="highball_pubkey" rows="3" readonly
              style="background-color: #f5f5f5;">{{ highball_public_key }}</textarea>
    <div class="help-text">Copy this key and add it to ~/.ssh/authorized_keys on the target host before proceeding.</div>
    <button type="button" 
            hx-post="/htmx/copy-to-clipboard" 
            hx-vals='{"text": "{{ highball_public_key }}"}'
            class="button" style="margin-top: 10px;">Copy to Clipboard</button>
</div>
