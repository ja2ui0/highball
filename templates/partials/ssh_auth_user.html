<div class="form-group">
    <label for="highball_pubkey">Highball SSH Public Key:</label>
    <textarea id="highball_pubkey" name="highball_pubkey" rows="3" readonly>{{ highball_public_key }}</textarea>
    <div class="help-text">Copy this key and add it to ~/.ssh/authorized_keys on the target host before proceeding.</div>
    <button type="button" 
            onclick="copyToClipboard('{{ highball_public_key }}', this)"
            class="button mt-sm">Copy to Clipboard</button>
</div>
